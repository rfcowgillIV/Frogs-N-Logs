# TEMPORARY: Android-only diagnosis (branch app-tests, not for merging)
#
# Downloads the newest app release and actually runs each app on a real machine of that kind
# (free GitHub runners): a Windows PC, an Apple-silicon Mac, Linux, and an Android emulator.
# For each one it waits for the title screen, takes a screenshot, presses Space to start a
# round, takes another, and checks the game's log for crashes.
# Screenshots and logs go to the "app-test-screenshots" branch so they're easy to look at.
#
# Runs automatically after "App builds" finishes, or by hand (Actions > App tests > Run).
name: App tests

on:
  workflow_run:
    workflows: [ "App builds" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to test (blank = newest)"
        required: false
        default: ""
  push:
    branches: [ "app-tests" ]

permissions:
  contents: write

env:
  APP_ID: com.freddietindlecowgill.frogsnlogs

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "::error::No release to test yet"; exit 1; }
          echo "Testing $tag"; echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir out
          cat > android-test.sh <<'SH'
          set -x
          for tag in v1.3.0 v1.2.0; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'Frogs-N-Logs-Android.apk' -O app-$tag.apk --clobber || true
          done
          for tag in v1.3.0 v1.2.0; do
            adb logcat -c || true
            adb uninstall "$APP_ID" || true
            adb install -r app-$tag.apk
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > out/$tag-title.png
            adb logcat -d > out/$tag-logcat-full.txt || true
            adb shell dumpsys activity exit-info "$APP_ID" > out/$tag-exit-info.txt || true
            adb shell getprop > out/$tag-getprop.txt || true
            adb shell dumpsys meminfo > out/$tag-meminfo.txt || true
            if adb shell pidof "$APP_ID"; then echo "$tag alive=true" >> out/result.txt; else echo "$tag alive=false" >> out/result.txt; fi
          done
          cat out/result.txt
          SH
          chmod +x android-test.sh
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an Android emulator (Android 14, 64-bit)
        env: { GH_TOKEN: "${{ github.token }}" }
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-diag, path: out }
